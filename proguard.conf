# ============================================================
# ProGuard configuration - OrquestadorAutomatizaciones
# ============================================================

# No optimizar (solo ofuscar/renombrar)
-dontoptimize

# Ignorar advertencias de referencias no resueltas (son de librerias internas)
-ignorewarnings
-dontwarn **

# Eliminar informacion de debug
-renamesourcefileattribute SourceFile
-keepattributes Exceptions,InnerClasses,Signature,Deprecated,EnclosingMethod

# ── Punto de entrada principal ─────────────────────────────
-keep public class com.orquestador.app.Main {
    public static void main(java.lang.String[]);
}
-keep public class com.orquestador.maestro.AppMaestra {
    public static void main(java.lang.String[]);
}

# ── Ciclo de vida JavaFX Application ──────────────────────
-keep class * extends javafx.application.Application {
    public void start(javafx.stage.Stage);
    public void init();
    public void stop();
}

# ── Modelos (GSON usa reflexion para serializar) ───────────
-keepclassmembers class com.orquestador.modelo.** {
    *;
}
-keep class com.orquestador.modelo.** { *; }

# ── Enums (necesitan metodos estaticos por reflexion) ──────
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
    public ** name();
    public int ordinal();
}

# ── Serializable ──────────────────────────────────────────
-keepclassmembers class * implements java.io.Serializable {
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# ── No tocar librerias de terceros ─────────────────────────
-keep class javafx.** { *; }
-keep class com.sun.javafx.** { *; }
-keep class org.apache.** { *; }
-keep class com.google.gson.** { *; }
-keep class org.slf4j.** { *; }
-keep class ch.qos.logback.** { *; }
-keep class org.openxmlformats.** { *; }
-keep class schemasMicrosoftComOffice.** { *; }
-keep class org.etsi.** { *; }
-keep class org.w3.** { *; }
-keep class com.microsoft.** { *; }
-keep class module-info { *; }

# Ignorar advertencias de librerias de terceros
-dontwarn javafx.**
-dontwarn com.sun.javafx.**
-dontwarn org.apache.**
-dontwarn com.google.**
-dontwarn org.slf4j.**
-dontwarn ch.qos.**
-dontwarn sun.**
-dontwarn java.awt.**
-dontwarn javax.**
-dontwarn org.w3c.**
-dontwarn org.xml.**

# Sin notas para mantener la salida limpia
-dontnote **
